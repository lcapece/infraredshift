<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Infraredshift logo</title>
  <desc id="desc">A data warehouse opened to reveal a red internal analytics layer, beside the Infraredshift wordmark.</desc>

  <!-- Data warehouse exterior -->
  <g fill="#1D252B">
    <!-- Left bank -->
    <path d="M60 98 166 62 166 126 60 143Z"/>
    <path d="M60 153 166 138 166 194 60 199Z"/>
    <path d="M60 210 166 206 166 262 60 254Z"/>
    <path d="M60 266 166 274 166 338 60 309Z"/>

    <!-- Right bank -->
    <path d="M294 62 400 98 400 143 294 126Z"/>
    <path d="M294 138 400 153 400 199 294 194Z"/>
    <path d="M294 206 400 210 400 254 294 262Z"/>
    <path d="M294 274 400 266 400 309 294 338Z"/>
  </g>

  <!-- Revealed internal analytics slice -->
  <path fill="#E33A2E" d="M182 64 278 82 278 326 182 356Z"/>
  <path fill="#B92721" d="M266 87 278 82 278 326 266 330Z"/>

  <!-- Internal data cells -->
  <g fill="#FFFFFF">
    <rect x="199" y="91" width="15" height="15" rx="2"/>
    <rect x="220" y="96" width="15" height="15" rx="2"/>
    <rect x="241" y="100" width="15" height="15" rx="2"/>
    <rect x="199" y="113" width="15" height="15" rx="2"/>
    <rect x="220" y="117" width="15" height="15" rx="2"/>
    <rect x="241" y="121" width="15" height="15" rx="2"/>
    <rect x="199" y="135" width="15" height="15" rx="2"/>
    <rect x="220" y="139" width="15" height="15" rx="2"/>
    <rect x="241" y="143" width="15" height="15" rx="2"/>

    <rect x="198" y="272" width="14" height="14" rx="2"/>
    <rect x="219" y="267" width="14" height="14" rx="2"/>
    <rect x="240" y="262" width="14" height="14" rx="2"/>
    <rect x="198" y="293" width="14" height="14" rx="2"/>
    <rect x="219" y="288" width="14" height="14" rx="2"/>
    <rect x="240" y="283" width="14" height="14" rx="2"/>
    <rect x="198" y="314" width="14" height="14" rx="2"/>
    <rect x="219" y="309" width="14" height="14" rx="2"/>
    <rect x="240" y="304" width="14" height="14" rx="2"/>
  </g>

  <!-- Query-plan topology -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 192 230 181 252 193 230 211 207 201Z"/>
    <path d="M230 181V165M207 192l-14-8M252 193l13-8M230 211v17"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="230" cy="165" r="6"/>
    <circle cx="193" cy="184" r="6"/>
    <circle cx="265" cy="185" r="6"/>
    <circle cx="230" cy="228" r="6"/>
  </g>

  <!-- Wordmark -->
  <text x="470" y="270" fill="#1D252B" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="148" letter-spacing="-7">
    <tspan font-weight="700">Infra</tspan><tspan font-weight="400">redshift</tspan>
  </text>
